name: Stage CI/CD
on:
  push:
    branches:
      - "stage"
  pull_request:
    branches:
      - "stage"
  workflow_dispatch:

env:
  CI: false

jobs:
  deploy:
    name: build && push image to Docker hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import Secrets
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
              github/data/general/docker/rumsan username | DOCKERHUB_USERNAME ;
              github/data/general/docker/rumsan password | DOCKERHUB_TOKEN ;
              github/data/rumsan/virtuperks/web/sampleData stage | SAMPLE_DATA ;
              github/data/rumsan/virtuperks/web/env stage | ENV_STAGE ;

      - name: create environment file
        run: |
          tee ./apps/web/.env <<<"$ENV_STAGE"
          tee ./apps/web/sampleData.ts <<<"$SAMPLE_DATA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Events-App Image
      - name: build && push events-app
        id: build-push-events-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: rumsan/virtuperks-web:stage
