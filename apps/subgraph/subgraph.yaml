specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AccessManager
    network: base-sepolia
    source:
      abi: AccessManager
      address: "0x48a90E9486314A8efDCd20d1927b013333a3cE9a"
      startBlock: 23333238
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppCreated
        - OwnershipTransferred
        - RoleGranted
        - RoleRevoked
      abis:
        - name: AccessManager
          file: ./abis/AccessManager.json
      eventHandlers:
        - event: AppCreated(indexed bytes32,indexed address)
          handler: handleAppCreated
        - event: OwnershipTransferred(indexed bytes32,indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RoleGranted(bytes32,indexed bytes32,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(bytes32,indexed bytes32,indexed address)
          handler: handleRoleRevoked
      file: ./src/access-manager.ts
  - kind: ethereum
    name: RewardToken
    network: base-sepolia
    source:
      abi: RewardToken
      address: "0xB556cF0D7A001d59182b8DCdAcFd4cc08c6cD1a4"
      startBlock: 23333267
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - Transfer
      abis:
        - name: RewardToken
          file: ./abis/RewardToken.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/reward-token.ts
  - kind: ethereum
    name: EntityFactory
    network: base-sepolia
    source:
      abi: EntityFactory
      address: "0x3370d3C6260DFFafc238f8C1C292B8ba436c8ADd"
      startBlock: 23333276
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - EntityTaskManagerCreated
      abis:
        - name: EntityFactory
          file: ./abis/EntityFactory.json
      eventHandlers:
        - event: EntityTaskManagerCreated(address,address,bytes32,string)
          handler: handleEntityTaskManagerCreated
      file: ./src/entity-factory.ts
templates:
  - kind: ethereum
    name: EntityContract
    network: base-sepolia
    source:
      abi: EntityContract
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - PINGED
        - ParticiantApplied
        - TaskAccepted
        - TaskApproved
        - TaskCompleted
        - TaskCreated
      abis:
        - name: EntityContract
          file: ./abis/EntityContract.json
      eventHandlers:
        - event: PINGED(indexed address,uint256)
          handler: handlePINGED
        - event: ParticiantApplied(indexed bytes32,indexed address)
          handler: handleParticiantApplied
        - event: TaskAccepted(indexed bytes32,indexed address)
          handler: handleTaskAccepted
        - event: TaskApproved(indexed bytes32,indexed address)
          handler: handleTaskApproved
        - event: TaskCompleted(indexed bytes32,indexed address)
          handler: handleTaskCompleted
        - event: TaskCreated(indexed bytes32,indexed address)
          handler: handleTaskCreated
      file: ./src/entity-contract.ts
