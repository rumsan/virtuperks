specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AppRegistry
    network: base-sepolia
    source:
      address: '0xee6483Ac9c6c217376f72d020a054581DeA7bD7f'
      abi: AppRegistry
      startBlock: 33964694
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppCreated
        - AppNameUpdated
        - AppPrivacyChanged
        - RoleAdminGranted
        - RoleAdminRevoked
        - RoleGranted
        - RoleRevoked
      abis:
        - name: AppRegistry
          file: ./abis/AppRegistry.json
      eventHandlers:
        - event: AppCreated(indexed bytes32,indexed address,indexed address)
          handler: handleAppCreated
        - event: AppNameUpdated(indexed bytes32,string,indexed address)
          handler: handleAppNameUpdated
        - event: AppPrivacyChanged(indexed bytes32,indexed bool,indexed address)
          handler: handleAppPrivacyChanged
        - event: RoleAdminGranted(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleAdminGranted
        - event: RoleAdminRevoked(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleAdminRevoked
        - event: RoleGranted(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleRevoked
      file: ./src/app-registry.ts
  - kind: ethereum
    name: RewardToken
    network: base-sepolia
    source:
      address: '0x68c54e3C1ee4819EbDd7Fb62AECD79b98b60E3AF'
      abi: RewardToken
      startBlock: 33964709
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Approval
        - Transfer
      abis:
        - name: RewardToken
          file: ./abis/RewardToken.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/reward-token.ts
  - kind: ethereum
    name: RewardManagementFactory
    network: base-sepolia
    source:
      address: '0xD7F2F7F9EE472063Ac76C2E4A34244EF0e59Cf19'
      abi: RewardManagementFactory
      startBlock: 33964714
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OwnerAdded
        - RewardManagementCreated
      abis:
        - name: RewardManagementFactory
          file: ./abis/RewardManagementFactory.json
      eventHandlers:
        - event: OwnerAdded(indexed bytes32,string,indexed address)
          handler: handleOwnerAdded
        - event: RewardManagementCreated(address,address,bytes32,string,bytes32)
          handler: handleRewardManagementCreated
      file: ./src/reward-management-factory.ts
templates:
  - kind: ethereum
    name: RewardManagement
    network: base-sepolia
    source:
      abi: RewardManagement
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AdditionalDisbursementToTask
        - ContractPaused
        - ContractUnpaused
        - DisbursementToParticipant
        - DisbursementToTask
        - EtherWithdrawn
        - ParticipantRemovedFromWhitelist
        - ParticipantWhitelisted
        - TaskAssignmentAccepted
        - TaskAssignmentApplied
        - TaskAssignmentApproved
        - TaskAssignmentCompleted
        - TaskAssignmentRejected
        - TaskAssignmentVerified
        - TaskClosed
        - TaskCreated
        - TaskDetailsUpdated
        - TokenTransferred
        - TokensAllocatedToTask
      abis:
        - name: RewardManagement
          file: ./abis/RewardManagement.json
      eventHandlers:
        - event: AdditionalDisbursementToTask(indexed bytes32,uint256,string,indexed address)
          handler: handleAdditionalDisbursementToTask
        - event: ContractPaused(indexed address)
          handler: handleContractPaused
        - event: ContractUnpaused(indexed address)
          handler: handleContractUnpaused
        - event: DisbursementToParticipant(indexed bytes32,uint256,indexed address,indexed address)
          handler: handleDisbursementToParticipant
        - event: DisbursementToTask(indexed bytes32,uint256,indexed address)
          handler: handleDisbursementToTask
        - event: EtherWithdrawn(indexed address,uint256,indexed address)
          handler: handleEtherWithdrawn
        - event: ParticipantRemovedFromWhitelist(indexed bytes32,indexed address,indexed address)
          handler: handleParticipantRemovedFromWhitelist
        - event: ParticipantWhitelisted(indexed bytes32,indexed address,indexed address)
          handler: handleParticipantWhitelisted
        - event: TaskAssignmentAccepted(indexed bytes32,indexed address)
          handler: handleTaskAssignmentAccepted
        - event: TaskAssignmentApplied(indexed bytes32,indexed address)
          handler: handleTaskAssignmentApplied
        - event: TaskAssignmentApproved(indexed bytes32,indexed address)
          handler: handleTaskAssignmentApproved
        - event: TaskAssignmentCompleted(indexed bytes32,indexed address)
          handler: handleTaskAssignmentCompleted
        - event: TaskAssignmentRejected(indexed bytes32,indexed address,indexed address,string)
          handler: handleTaskAssignmentRejected
        - event: TaskAssignmentVerified(indexed bytes32,indexed address,indexed address)
          handler: handleTaskAssignmentVerified
        - event: TaskClosed(indexed bytes32,indexed address)
          handler: handleTaskClosed
        - event: TaskCreated(indexed bytes32,indexed address)
          handler: handleTaskCreated
        - event: TaskDetailsUpdated(indexed bytes32,indexed address)
          handler: handleTaskDetailsUpdated
        - event: TokenTransferred(indexed address,indexed address,uint256,string,indexed address)
          handler: handleTokenTransferred
        - event: TokensAllocatedToTask(indexed bytes32,indexed address,uint256,indexed address)
          handler: handleTokensAllocatedToTask
      file: ./src/reward-management.ts
