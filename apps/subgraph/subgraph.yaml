specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AccessManager
    network: mainnet
    source:
      address: "0x50D75C1BC6a1cE35002C9f92D0AF4B3684aa6B74"
      abi: AccessManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - AppCreated
        - OwnershipTransferred
        - RoleGranted
        - RoleRevoked
      abis:
        - name: AccessManager
          file: ./abis/AccessManager.json
      eventHandlers:
        - event: AppCreated(indexed bytes32,indexed address)
          handler: handleAppCreated
        - event: OwnershipTransferred(indexed bytes32,indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RoleGranted(bytes32,indexed bytes32,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(bytes32,indexed bytes32,indexed address)
          handler: handleRoleRevoked
      file: ./src/access-manager.ts
  - kind: ethereum
    name: RewardToken
    network: mainnet
    source:
      address: "0xD2E8d9173584D4DaA5C8354a79eF75ceC2dfa228"
      abi: RewardToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Approval
        - Transfer
      abis:
        - name: RewardToken
          file: ./abis/RewardToken.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/reward-token.ts
  - kind: ethereum
    name: FactoryContract
    network: mainnet
    source:
      address: "0x56F7DC1Cc938d6d6575B68d70d381F9C28C8C7b7"
      abi: FactoryContract
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - EntityTaskManagerCreated
      abis:
        - name: FactoryContract
          file: ./abis/FactoryContract.json
      eventHandlers:
        - event: EntityTaskManagerCreated(address,address,bytes32,string)
          handler: handleEntityTaskManagerCreated
      file: ./src/factory-contract.ts

templates:
  - kind: ethereum
    name: EntityContract
    network: mainnet
    source:
      abi: EntityContract
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ParticiantApplied
        - TaskAccepted
        - TaskApproved
        - TaskCompleted
        - TaskCreated
      abis:
        - name: EntityContract
          file: ./abis/EntityContract.json
      eventHandlers:
        - event: ParticiantApplied(indexed string,indexed address)
          handler: handleParticiantApplied
        - event: TaskAccepted(indexed string)
          handler: handleTaskAccepted
        - event: TaskApproved(indexed string,indexed address)
          handler: handleTaskApproved
        - event: TaskCompleted(indexed string,indexed address)
          handler: handleTaskCompleted
        - event: TaskCreated(indexed string,indexed address,string,address,uint256,address[],uint256,uint256,address,bool)
          handler: handleTaskCreated
      file: ./src/entity-contract.ts