specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AppRegistry
    network: base-sepolia
    source:
      address: "0xee6483Ac9c6c217376f72d020a054581DeA7bD7f"
      abi: AppRegistry
      startBlock: 33964694
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AppCreated
        - AppNameUpdated
        - AppPrivacyChanged
        - RoleAdminGranted
        - RoleAdminRevoked
        - RoleGranted
        - RoleRevoked
      abis:
        - name: AppRegistry
          file: ./abis/AppRegistry.json
      eventHandlers:
        - event: AppCreated(indexed bytes32,indexed address,indexed address)
          handler: handleAppCreated
        - event: AppNameUpdated(indexed bytes32,string,indexed address)
          handler: handleAppNameUpdated
        - event: AppPrivacyChanged(indexed bytes32,indexed bool,indexed address)
          handler: handleAppPrivacyChanged
        - event: RoleAdminGranted(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleAdminGranted
        - event: RoleAdminRevoked(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleAdminRevoked
        - event: RoleGranted(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed bytes32,indexed address,address)
          handler: handleRoleRevoked
      file: ./src/app-registry.ts
