specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Entity
    network: base-sepolia
    source:
      address: "0xf00E856a7E602468bAE51AEff431Aa22Ce2d3bbD"
      abi: Entity
      startBlock: 35957078
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AllocationsFrozen
        - AppContractUpdated
        - EmergencyWithdrawal
        - EntityDeactivated
        - EntityInitialized
        - EntityUpgraded
        - Initialized
        - OwnershipTransferred
        - ParticipantRemovedFromWhitelist
        - ParticipantWhitelisted
        - RewardsDistributed
        - TaskAssignmentAccepted
        - TaskAssignmentApplied
        - TaskAssignmentApproved
        - TaskAssignmentCompleted
        - TaskAssignmentRejected
        - TaskClosed
        - TaskCreated
        - TaskDetailsUpdated
        - TokensDeposited
        - TokensWithdrawn
        - Upgraded
      abis:
        - name: Entity
          file: ./abis/Entity.json
      eventHandlers:
        - event: AllocationsFrozen(indexed address)
          handler: handleAllocationsFrozen
        - event: AppContractUpdated(indexed address,indexed address)
          handler: handleAppContractUpdated
        - event: EmergencyWithdrawal(indexed address,indexed address,uint256,indexed address)
          handler: handleEmergencyWithdrawal
        - event: EntityDeactivated(indexed address)
          handler: handleEntityDeactivated
        - event: EntityInitialized(indexed address,string)
          handler: handleEntityInitialized
        - event: EntityUpgraded(indexed address)
          handler: handleEntityUpgraded
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: ParticipantRemovedFromWhitelist(indexed bytes32,indexed address,indexed address)
          handler: handleParticipantRemovedFromWhitelist
        - event: ParticipantWhitelisted(indexed bytes32,indexed address,indexed address)
          handler: handleParticipantWhitelisted
        - event: RewardsDistributed(indexed bytes32,uint256,uint256)
          handler: handleRewardsDistributed
        - event: TaskAssignmentAccepted(indexed bytes32,indexed address)
          handler: handleTaskAssignmentAccepted
        - event: TaskAssignmentApplied(indexed bytes32,indexed address)
          handler: handleTaskAssignmentApplied
        - event: TaskAssignmentApproved(indexed bytes32,indexed address)
          handler: handleTaskAssignmentApproved
        - event: TaskAssignmentCompleted(indexed bytes32,indexed address)
          handler: handleTaskAssignmentCompleted
        - event: TaskAssignmentRejected(indexed bytes32,indexed address,indexed address,string)
          handler: handleTaskAssignmentRejected
        - event: TaskClosed(indexed bytes32,indexed address)
          handler: handleTaskClosed
        - event: TaskCreated(indexed bytes32,indexed address)
          handler: handleTaskCreated
        - event: TaskDetailsUpdated(indexed bytes32,indexed address)
          handler: handleTaskDetailsUpdated
        - event: TokensDeposited(indexed address,uint256,indexed address)
          handler: handleTokensDeposited
        - event: TokensWithdrawn(indexed address,indexed address,uint256,indexed address)
          handler: handleTokensWithdrawn
        - event: Upgraded(indexed address)
          handler: handleUpgraded
      file: ./src/entity.ts
