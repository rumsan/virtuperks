type AppCreated @entity(immutable: true) {
  id: Bytes!
  appId: Bytes! # bytes32
  admin: Bytes! # address
  sender: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

