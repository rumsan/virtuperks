type TaskDetail @entity {
  id: Bytes!

  name: String!
  detailsUrl: String!
  owner: Bytes!
  expiryDate: BigInt!
  rewardToken: Bytes!
  totalRewardAmount: BigInt!
  isOpen: Boolean!
  requireApproval: Boolean!
  isWhitelisted: Boolean!
  isTokenDisbursed: Boolean!
  maxParticipants: BigInt!
  acceptedParticipantCount: BigInt!
  verifiedParticipants: [Bytes!]!
  createdAt: BigInt
  task: TaskCreated
}

type TaskCreated @entity(immutable: true) {
  id: Bytes!
  internal_id: Bytes!
  taskDetail: TaskDetail
  createdBy: Bytes!
  rewardManagement: RewardManagementCreated
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ParticipantTaskStatus @entity(immutable: false) {
