type TaskDetail @entity (immutable: false) {
  id: Bytes!

  name: String!
  detailsUrl: String!
  owner: Bytes!
  expiryDate: BigInt!
  rewardToken: Bytes!
  totalRewardAmount: BigInt!
  isOpen: Boolean!
  requireApproval: Boolean!
  isWhitelisted: Boolean!
  isTokenDisbursed: Boolean!
  maxParticipants: BigInt!
  acceptedParticipantCount: BigInt!
  verifiedParticipants: [Bytes!]!
  whitelistedParticipants: [Bytes!]

  
  createdAt: BigInt
  task: TaskCreated
}


type TaskCreated @entity(immutable: true) {
  id: Bytes!
  internal_id: Bytes! # bytes32
  taskDetail: TaskDetail
  createdBy: Bytes! # address
  rewardManagement: RewardManagementCreated
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ParticipantTaskStatus @entity(immutable: false) {
  id: Bytes! 
  participant: Bytes! 
  taskId: Bytes! 
  status: String! 
  lastUpdatedBlock: BigInt! 
  lastUpdatedTimestamp: BigInt!
  taskDetail: TaskDetail
  completionUrl: String # string
  rejectedReason: String # reason for rejection if status is REJECTED
  rewardManagement: RewardManagementCreated
}

type TaskIdMapping @entity (immutable: false) {
  id: Bytes! # internal_id (event.params.id)
  taskCreated: TaskCreated!
}


