type AppCreated @entity(immutable: true) {
  id: Bytes!
  appId: Bytes! # bytes32
  admin: Bytes! # address
  sender: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AppNameUpdated @entity(immutable: true) {
  id: Bytes!
  appId: Bytes! # bytes32
  newName: String! # string
  sender: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type AppPrivacyChanged @entity(immutable: true) {
  id: Bytes!
  appId: Bytes! # bytes32
  isPrivate: Boolean! # bool
  sender: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

