type Approval @entity(immutable: true) {
  id: Bytes!
  owner: Bytes! # address
  spender: Bytes! # address
  value: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Transfer @entity(immutable: true) {
  id: Bytes!
  from: Bytes! # address
  to: Bytes! # address
  value: BigInt! # uint256
  rewardManagement: RewardManagementCreated
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type RewardManagementCreated @entity {
  id: Bytes!
  rewardManagement: Bytes! # address
   appId: Bytes! # bytes32
  name: String! # string
  registry: Bytes! # address
  entityId: Bytes! # bytes32
  tasks: [TaskCreated!] @derivedFrom(field: "rewardManagement")
  tokenTransfers: [TokenTransferred!] @derivedFrom(field: "rewardManagement")
  disbursements: [DisbursementToTask!] @derivedFrom(field: "rewardManagement")
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  
}
type AdditionalDisbursementToTask @entity(immutable: true) {
  id: Bytes!
  taskId: Bytes! # bytes32
  amount: BigInt! # uint256
  remarks: String! # string
  disbursedBy: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ContractPaused @entity(immutable: true) {
  id: Bytes!
  by: Bytes! # address
